; U盘游戏启动器 - 全局配置
[general]
; auto = 优先目录联接，失败自动降级为复制；link = 只用联接；copy = 只用复制
mode=auto
; 每个游戏保留最近几份存档快照
snapshot_keep=5
; 单次快照体积上限（MB），超过则跳过本次快照
max_snapshot_mb=200
; 日志保留天数（启动时自动删除更早的 launcher_*.log）
log_keep_days=14
; 每个游戏保留最近几份「接管前备份」
backup_keep=3
; 快照/复制时跳过的目录名（缓存、日志之类，任何层级同名目录都会跳过）
exclude_dirs=shader_cache,logs,cache,temp
; 窗口置顶（1=是）
topmost=0
; 背景壁纸（相对 Launcher 目录，留空则纯色）
wallpaper=
; 壁纸不透明度 0-100
wallpaper_opacity=65
; 卡片不透明度 0-100（左侧详情卡与游戏卡共用）
panel_opacity=88
