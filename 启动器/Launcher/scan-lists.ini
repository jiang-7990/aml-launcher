; 扫描名单（添加游戏时使用）
; 只影响「添加游戏」向导里列出的 exe，不影响已经添加的游戏。
; 每行一个关键字，; 或 # 开头是注释；改完保存，下一次扫描生效。
; 内置名单已覆盖常见卸载/安装/更新/崩溃上报/前置安装/引擎崩溃处理器 + 压缩/浏览器/反作弊助手，这里只补额外的。

[exclude]
; 文件名或相对路径含这些词的 exe 会被当作工具隐藏（不区分大小写）
; 例：
; ridersrepublic
; uplaycrashreporter

; Delta Force（D:\Delta Force 实测）
卸载
gpu_detect
tinydl
taslogin
es_broadcast
assistant
startup_runner
wegamelauncher

; Genshin Impact（E:\Program Files\Genshin Impact 实测）
iconrefresher
beyondeditor

[skip_dirs]
; 扫描游戏文件夹时，这些名字的子目录整体跳过（如引擎中间件、工具目录）
; 例：
; games

[include]
; 反过来：文件名或相对路径含这些词的 exe 一律当游戏显示（即使命中内置工具规则）
; 用于游戏主程序名字里带 setup/update/launcher 之类关键字的误杀
; 例：
; mygame_setup
